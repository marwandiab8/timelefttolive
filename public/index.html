<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Left To Live</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101418;
        color: #f4f0e8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 20%, rgba(230, 196, 99, 0.18), transparent 28rem),
          linear-gradient(135deg, #101418 0%, #1f2930 48%, #15171b 100%);
      }

      main {
        width: min(680px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.5rem, 6vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 34rem;
        color: #d8d0c1;
        font-size: 1.125rem;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Time Left To Live</h1>
      <p>Your Firebase project is connected and ready for the app build.</p>
    </main>
  </body>
</html>
